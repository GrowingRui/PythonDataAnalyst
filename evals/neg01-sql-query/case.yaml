schema_version: "1.0"
name: neg01-sql-query
description: Should NOT load the python-data-analyst skill.
tags: [should-not-trigger]
execution:
  prompt: "Write a SQL query that returns the top 5 customers by total order value, from tables orders(customer_id, amount) and customers(id, name)."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: skill-not-loaded
    tool: Skill
    input_match: python-data-analyst
    min: 0
    max: 0
    arm: both
