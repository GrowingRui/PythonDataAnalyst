schema_version: "1.0"
name: neg04-convert-format
description: Should NOT load the python-data-analyst skill.
tags: [should-not-trigger]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Convert sales.csv to JSON Lines."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: skill-not-loaded
    tool: Skill
    input_match: python-data-analyst
    min: 0
    max: 0
    arm: both
