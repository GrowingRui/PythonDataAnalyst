schema_version: "1.0"
name: neg10-email-draft
description: Should NOT load the python-data-analyst skill.
tags: [should-not-trigger]
execution:
  prompt: "Draft a short email to my team saying the Q3 sales report will be a week late."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: skill-not-loaded
    tool: Skill
    input_match: python-data-analyst
    min: 0
    max: 0
    arm: both
