schema_version: "1.0"
name: neg07-csv-function
description: Should NOT load the python-data-analyst skill.
tags: [should-not-trigger]
execution:
  prompt: "Write a Python function that reads a CSV file and returns how many rows it has."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: skill-not-loaded
    tool: Skill
    input_match: python-data-analyst
    min: 0
    max: 0
    arm: both
