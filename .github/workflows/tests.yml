name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          # The skill is often used on Windows: check encodings and paths there too.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  minimum-versions:
    # requirements.txt promises these minimums: prove they still work.
    # Keep the pins below in sync with requirements.txt and requirements-dev.txt.
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimum versions
        run: >-
          python -m pip install
          "pandas==2.1.*" "numpy==1.26.*" "matplotlib==3.8.*"
          "seaborn==0.13.0" "openpyxl==3.1.0" "pyarrow==14.0.*" "pytest==8.0.*"
      - name: Run tests
        run: python -m pytest

  skill-format:
    # The official validators: the open Agent Skills format, and the Claude Code plugin.
    name: Skill and plugin format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate SKILL.md against the Agent Skills spec
        run: |
          python -m pip install "skills-ref==0.1.1"
          agentskills validate skills/python-data-analyst
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate the Claude Code plugin and marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate .
