name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          # The skill is often used on Windows: check encodings and paths there too.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  minimum-versions:
    # requirements.txt promises these minimums: prove they still work.
    # Keep the pins below in sync with requirements.txt and requirements-dev.txt.
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimum versions
        run: >-
          python -m pip install
          "pandas==2.1.*" "numpy==1.26.*" "matplotlib==3.8.*"
          "seaborn==0.13.0" "openpyxl==3.1.0" "pytest==8.0.*"
      - name: Run tests
        run: python -m pytest
